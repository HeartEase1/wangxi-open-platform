# 往昔开放平台：从 GitHub Container Registry 拉取已构建镜像，
# 并自动创建 PostgreSQL 与 Redis。更新时执行：
# docker compose pull && docker compose up -d --remove-orphans
name: wangxi-open-platform

services:
  platform:
    image: ${WANGXI_IMAGE:-ghcr.io/heartease1/wangxi-open-platform}:${WANGXI_IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    command: ["--log-dir", "/app/logs"]
    environment:
      # 未在 .env 中覆盖时使用随 Compose 创建的 PostgreSQL/Redis。
      SQL_DSN: ${SQL_DSN:-postgresql://${POSTGRES_USER:-wangxi}:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/${POSTGRES_DB:-wangxi}?sslmode=disable}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/0}
      TZ: Asia/Shanghai
      NODE_NAME: wangxi-node-1
      ERROR_LOG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wangxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-wangxi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wangxi} -d ${POSTGRES_DB:-wangxi}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-this-redis-password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-this-redis-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
