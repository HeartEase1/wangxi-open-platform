# 往昔开放平台：从本仓库构建，执行 docker compose up -d --build
name: wangxi-open-platform

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: wangxi-open-platform:local
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    command: ["--log-dir", "/app/logs"]
    environment:
      TZ: Asia/Shanghai
      NODE_NAME: wangxi-node-1
      ERROR_LOG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
