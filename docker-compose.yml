# 往昔开放平台：默认从 GitHub Container Registry 拉取已构建镜像。
# 更新时执行：docker compose pull && docker compose up -d --remove-orphans
name: wangxi-open-platform

services:
  platform:
    image: ${WANGXI_IMAGE:-ghcr.io/heartease1/wangxi-open-platform}:${WANGXI_IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    command: ["--log-dir", "/app/logs"]
    environment:
      TZ: Asia/Shanghai
      NODE_NAME: wangxi-node-1
      ERROR_LOG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
