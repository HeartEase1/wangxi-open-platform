name: Build Wangxi container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '额外发布的镜像标签（例如 staging）'
        required: false
        type: string
permissions:
  contents: read
  packages: write

concurrency:
  group: wangxi-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The repository currently allows only local HeartEase1 Actions. Use the
      # GitHub-hosted runner's built-in Git and Docker commands so no external
      # action permission is needed.
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Login to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$CR_PAT" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish image
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("-t" "$IMAGE:sha-${GITHUB_SHA}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=("-t" "$IMAGE:latest")
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("-t" "$IMAGE:${GITHUB_REF_NAME}")
          fi
          if [ -n "$EXTRA_TAG" ]; then
            tags+=("-t" "$IMAGE:$EXTRA_TAG")
          fi
          docker build "${tags[@]}" .
          for ((i = 0; i < ${#tags[@]}; i += 2)); do
            docker push "${tags[i + 1]}"
          done
